[package]
name = "opencode-kit"
version = "0.0.1"
description = "OpenCode HTTP/SSE/WS client and session model for Rune apps"
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
getrandom = "0.3"
net-trust = { path = "../net-trust" }
rune.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive", "rc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polling.workspace = true
socket2 = "0.6"
tempfile = "3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq.workspace = true

# Windows: how long a connect keeps sending its SYN (`TCP_MAXRTMS`, `client::reach`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

# In a browser the connection is the page's own: XMLHttpRequest for requests (ureq-web), a
# streamed fetch for the event stream.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
ureq-web = { path = "../ureq-web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Document", "Element", "Headers", "HtmlAnchorElement", "MessageEvent", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "Url", "WebSocket", "Window"] }

[lints]
workspace = true
