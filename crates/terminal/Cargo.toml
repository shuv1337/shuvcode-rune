[package]
name = "terminal"
version = "0.0.1"
description = "Embeddable Ghostty-VT terminal pane for Rune apps over OpenCode PTY WebSockets"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
memchr = "2"
opencode-kit = { path = "../opencode-kit" }
parking_lot = "0.12"
rune.workspace = true
serde_json.workspace = true
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# wss:// natively; a browser build has no TLS of its own here.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
net-trust = { path = "../net-trust" }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# A persistent PTY's worker sleeps on its socket and its commands together (IOCP on Windows).
polling.workspace = true

# A page's attachment: its own WebSocket, on a task of its event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Event", "MessageEvent", "WebSocket", "Window"] }

[build-dependencies]
sha2 = "0.10"
# Matches desktop's `ureq` features (`browser-pane`) so native builds compile `ureq` once.
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }

[lints]
workspace = true
