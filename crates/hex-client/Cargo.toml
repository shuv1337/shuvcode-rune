[package]
name = "hex-client"
version = "0.0.1"
description = "Local HTTP client for driving Hex voice dictation from Rune apps"
edition.workspace = true
license.workspace = true

[dependencies]
harness-log = { path = "../harness-log" }
net-trust = { path = "../net-trust" }
serde_json.workspace = true
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

# A browser asks through the page (ureq-web); Hex itself isn't reachable from one, so its discovery
# file is never found there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ureq-web = { path = "../ureq-web" }

# A Windows Hex without the capture API needs the app to record the microphone (WASAPI) for its streams.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant"] }

[lints]
workspace = true
