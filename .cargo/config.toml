[net]
# Fetch git dependencies with the git CLI's configured credentials.
git-fetch-with-cli = true

# Windows: the C runtime linked in (`crt-static`: vcruntime and the C++ runtime Luau uses, so the exe
# needs no Visual C++ Redistributable and loads no VCRUNTIME140, VCRUNTIME140_1 or MSVCP140 before
# `main`), with the Universal CRT still Windows' own DLL (the "hybrid" CRT: ucrtbase ships with
# Windows 10 and later, and a static copy would only add its code to the exe).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/NODEFAULTLIB:libucrt.lib", "-C", "link-arg=/DEFAULTLIB:ucrt.lib"]

# Linux: the app's exe is linked through apps/desktop/scripts/link-order-linux.sh, which lays the
# functions a launch runs first and together (apps/desktop/pgo/startup-order.txt, the list the
# macOS link uses), so a launch whose exe is not in memory reads few pages of it. Every other link
# passes through to cc untouched, and so does the exe's own when the order cannot be made (the
# script never fails a build). A path with a slash is taken from the folder that holds `.cargo`.
# x86_64 only: its link goes through lld, which alone takes an order. The aarch64 link goes through
# the system linker, so the script could only pass it on and warn: that target keeps cargo's default.
[target.x86_64-unknown-linux-gnu]
linker = "apps/desktop/scripts/link-order-linux.sh"

# getrandom's browser backend (crypto.getRandomValues), which it takes only through this cfg; and
# wasm SIMD (every browser with JS Promise Integration has it): the CPU renderer's glyph fill takes
# 3 ms instead of 12 for a first frame, its paint 19 instead of 24.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\"", "-C", "target-feature=+simd128"]

# Bundled SQLite (opencode-storage) without what the store never uses: FTS3, R-tree,
# dbstat, stat4, sessions, column metadata, extension loading, soundex, shared cache, the
# deprecated API and malloc statistics. Every build (the farm's, CI's) takes it from here. FTS5
# stays, for local search: it costs the exe about 255 KB and each open about 28 µs (it registers
# its module), and nothing else until a table uses it.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_ENABLE_SESSION -USQLITE_ENABLE_PREUPDATE_HOOK -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION -USQLITE_SOUNDEX -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_DQS=0 -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_USE_ALLOCA"
# macOS: the deployment target the bundle declares (`LSMinimumSystemVersion` 13.0), not the
# toolchain's default 11.0. From 12.0 the linker writes dyld's chained fixups
# (`LC_DYLD_CHAINED_FIXUPS`) in place of the rebase opcodes (`LC_DYLD_INFO_ONLY`: 143,645 rebases
# that dyld applied before `main`). That is 19 M instructions less before `main`, which run on
# efficiency cores when the Dock starts the app.
MACOSX_DEPLOYMENT_TARGET = "13.0"