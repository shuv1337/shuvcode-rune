<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- Every URL here is relative to the page, so it runs wherever it's mounted (`/rune/` behind a
     proxy that strips it). Opened without the folder's slash, they'd resolve one level up. -->
<script>if (!/\/$|\.html$/.test(location.pathname)) location.replace(`${location.pathname}/${location.search}${location.hash}`);</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<!-- On a phone's Home Screen: the app's icon and name, opened without the browser's bars, its
     colour under the status bar (the app keeps its content inside the safe area), and no launch
     image: iOS shows the window's colour until the first frame. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuvcode">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="modulepreload" href="app.js">
<title>Shuvcode (Rune)</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }

  html { background: #fafafa; }
  @media (prefers-color-scheme: dark) { html { background: #080808; } }
  body { font: 13px/18px system-ui, sans-serif; color: CanvasText; }
  .box { box-sizing: border-box; border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); background: Canvas; }
  #connect { display: none; max-width: 380px; margin: max(96px, env(safe-area-inset-top)) auto; padding: 16px; }
  #connect h1 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  #connect label { display: block; margin: 8px 0 4px; color: color-mix(in srgb, CanvasText 60%, transparent); }
  #connect input { box-sizing: border-box; width: 100%; height: 28px; padding: 0 8px; font: 11px/16px ui-monospace, monospace; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 0; background: Canvas; color: CanvasText; }
  #connect .error { display: none; margin: 8px 0 0; color: #e5484d; }
  button { height: 28px; padding: 0 12px; font: inherit; border: 1px solid #009fff; border-radius: 0; background: #009fff; color: #fff; cursor: pointer; }
  .limits { margin: 12px 0 0; color: color-mix(in srgb, CanvasText 60%, transparent); }
  #status { position: fixed; inset: 0; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 420px); justify-content: center; align-content: center; padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left)); text-align: center; color: color-mix(in srgb, CanvasText 60%, transparent); pointer-events: none; }
  #notice, #stay { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 10; display: none; max-width: 360px; padding: 8px 12px; }
  #notice button { margin-top: 8px; height: 24px; }
  #stay h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  #stay p { margin: 0 0 8px; color: color-mix(in srgb, CanvasText 70%, transparent); }
  #stay .actions { display: flex; gap: 8px; }
  button.quiet { border-color: color-mix(in srgb, CanvasText 20%, transparent); background: Canvas; color: CanvasText; }
  /* A finger: 44 px targets, and 16 px text so iOS doesn't zoom into a field it focuses. */
  @media (pointer: coarse) {
    #connect { margin: max(48px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); max-width: none; }
    #connect input { height: 44px; font-size: 16px; }
    #connect button { width: 100%; height: 44px; margin-top: 16px; font-size: 16px; }
    /* Below the title row, not over the composer at the screen's foot. */
    #notice, #stay { top: calc(env(safe-area-inset-top) + 52px); bottom: auto; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); max-width: none; padding: 12px; }
    #notice button, #stay button { height: 44px; padding: 0 20px; font-size: 16px; }
    #stay .actions button { flex: 1; }
  }

<form id="connect" class="box" method="post" action="#">
  <h1 data-say="rune.web.connect.title"></h1>
  <label for="server" data-say="rune.web.connect.server"></label>
  <input id="server" name="url" type="url" autocomplete="url" placeholder="http://127.0.0.1:4919" required>
  <!-- The server's user is always opencode: here so a password manager saves and fills the pair. -->
  <input name="username" autocomplete="username" value="opencode" hidden>
  <label for="password" data-say="rune.web.connect.password"></label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <p class="error" id="connect-error" role="alert"></p>
  <button type="button" id="use-origin" class="quiet" hidden></button>
  <p class="limits" data-say="rune.web.limits"></p>
  <button type="submit" data-say="common.connect"></button>
</form>
<div id="stay" class="box" role="dialog" aria-labelledby="stay-title" aria-describedby="stay-body">
  <h2 id="stay-title" data-say="rune.web.stay.title"></h2>
  <p id="stay-body"></p>
  <div class="actions"><button type="button" id="stay-yes" data-say="rune.web.stay.yes"></button><button type="button" id="stay-no" class="quiet" data-say="rune.web.stay.no"></button></div>
</div>
<div id="notice" class="box" role="status"><span data-say="rune.web.limits"></span><br><button type="button" data-say="common.ok"></button></div>
<div id="status"></div>
<script id="page" type="application/json">{}</script>

    const first = await knock(server, pw);
    if (first !== 'password' || !pw) return { answer: first, pw };
    if (tidy(pw) !== pw.trim() && await knock(server, tidy(pw)) === 'ok') return { answer: 'ok', pw: tidy(pw) };
    const seen = lastKnock;
    if (await knock(server, null) === 'ok') return { answer: 'ok', pw: null };
    lastKnock = seen;
    return { answer: first, pw };
  }
  // Which server turned the password down, and how long the password it was sent was, so a wrong
  // server or a partial paste shows.
  const refused = (server, pw) => say('rune.web.connect.refused', { host: hostOf(server), count: String([...pw.trim()].length) });
  // What a refused sign-in looked like, for the page's server log (`POST diag`, `web-serve.ts`):
  // never the password, nor anything made from it but its length.
  async function report(stage, server, pw, source) {
    const seen = lastKnock ?? {};
    const bare = await knock(server, null);
    const body = { stage, source, host: hostOf(server), status: seen.status ?? 0, bodyTag: seen.bodyTag ?? '', challenge: !!seen.challenge, length: [...(pw ?? '').trim()].length, tidied: !!pw && tidy(pw) !== pw.trim(), bare, ua: navigator.userAgent, standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true };
    fetch('diag', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).catch(() => {});
  }
  // How this open signed in: 'offer' (with a password typed or in the address: the page offers to
  // keep it), 'kept' (with the one kept on the device) or 'none'.
  let signIn = 'none';
  let server = params.get('server') ?? remembered();
  // Settings › Server › Sign out (the app calls it): the kept password goes, and the page asks again.
  window.opencodeSignOut = async () => {
    if (server) await forget(server);
    location.replace(server ? `${folder}?server=${encodeURIComponent(server)}` : folder);
  };
  // Remembered only once it answered, so a mistyped address never becomes the next start.
  function connect(next, answered) {
    server = next;
    params.set('server', next);
    history.replaceState(null, '', `${location.pathname}?${params}`);
    if (answered) {
      try { localStorage.setItem(SERVER_KEY, next); } catch {}
      writeCookie(SERVER_COOKIE, next);
    }
    boot();
  }
  // The page never guesses a server: it asks (offering the address it was opened from when that
  // isn't this machine), and starts without reloading, so the password never enters an address.
  // A server that wants a password and has none is asked for one here, before the app starts.
  // `error` says why it asks: a function of the page's messages, which may not be in yet.
  async function ask(at, error, why) {
    await messagesReady;
    const form = document.querySelector('#connect');
    const url = document.querySelector('#server');
    const field = document.querySelector('#password');
    const message = document.querySelector('#connect-error');
    const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    url.value = at ?? (local ? '' : location.origin);
    const useOrigin = document.querySelector('#use-origin');
    useOrigin.onclick = () => {
      url.value = location.origin;
      useOrigin.hidden = true;
      form.requestSubmit();
    };
    // An http address of this page's own host, which an https page can't call: its https
    // address is one tap away.
    const offerOrigin = address => {
      const same = location.protocol === 'https:' && /^http:\/\//i.test(address ?? '') && URL.parse(address)?.hostname === location.hostname;
      useOrigin.hidden = !same;
      if (same) useOrigin.textContent = say('rune.web.connect.useOrigin', { origin: location.origin });
    };
    offerOrigin(at);
    message.textContent = error ? error() : '';
    message.style.display = error ? 'block' : 'none';
    form.style.display = 'block';
    stage('form', why);
    (url.value ? field : url).focus();
    form.onsubmit = async event => {
      event.preventDefault();
      const next = url.value.trim();
      const typed = field.value || null;
      const result = await knockAny(next, typed);
      if (result.answer !== 'ok') {
        if (result.answer === 'password' && typed) report('form', next, typed, 'form');
        stage('form', `refused: ${result.answer}${typed ? `, ${typed.length} characters` : ''}`);
        message.textContent = result.answer !== 'password' ? problem(result.answer) : typed ? refused(next, typed) : say('rune.web.connect.needsPassword');
        message.style.display = 'block';
        offerOrigin(next);

        (result.answer === 'password' ? field : url).focus();
        return;
      }
      password = result.pw;
      signIn = result.pw ? 'offer' : 'none';
      form.remove();
      connect(next, true);
    };
  }
  // An address that came with its password, a server with none, or one whose password is kept
  // here starts at once; one that turns the credential down asks for its password first (and a
  // kept one it turned down is forgotten). A server that doesn't answer starts too: the app says
  // it can't reach it, and keeps trying.
  async function open(at) {
    const kept = password?.trim() ? null : await keptPassword(at);
    const given = password?.trim() ? password : kept;
    const result = await knockAny(at, given);
    if (result.answer === 'password') {
      if (given) report('open', at, given, kept ? 'kept' : 'address');
      if (kept) await forget(at);
      ask(at, given ? () => refused(at, given) : () => say('rune.web.connect.needsPassword'), given ? (kept ? 'kept password refused' : 'password in the address refused') : 'needs a password');
      return;
    }
    // An address that isn't an OpenCode server, or that this page may not call, never starts the app.
    if (result.answer === 'notServer' || result.answer === 'insecure') {
      ask(at, () => problem(result.answer), result.answer);
      return;
    }
    password = result.pw;
    signIn = kept && result.pw === kept ? 'kept' : result.pw ? 'offer' : 'none';
    connect(at, result.answer === 'ok');
  }
  if (server) open(server);
  else ask(null, null, 'no server');
</script>
</html>
